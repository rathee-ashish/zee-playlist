name: Update Zee playlist

on:
  schedule:
    # Source stream URLs typically last about 6 hours. GitHub cron cannot
    # express a true repeating interval, so these UTC times are spaced
    # about 5 hours 45 minutes apart (00:00, 05:45, 11:30, 17:15, 23:00).
    # Jobs can still start late; this does not regenerate tokens.
    - cron: "0 0 * * *"
    - cron: "45 5 * * *"
    - cron: "30 11 * * *"
    - cron: "15 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Zee playlist updater
        continue-on-error: true
        env:
          SOURCE_M3U_URL: ${{ vars.SOURCE_M3U_URL || secrets.SOURCE_M3U_URL }}
        run: python scripts/update_zee.py

      - name: Run Star Sports playlist updater
        continue-on-error: true
        env:
          SOURCE_STAR_M3U_URL: ${{ vars.SOURCE_STAR_M3U_URL || secrets.SOURCE_STAR_M3U_URL }}
        run: python scripts/update_star_sports.py

      - name: Commit and push playlists when they changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zee.m3u star_sports.m3u all-channels.m3u
          if git diff --staged --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi
          git commit -m "chore: update playlists"
          git push
